name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/fuck-the-bus-game-dn29up, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Pages has to be switched on once by hand under Settings > Pages, with
      # the source set to GitHub Actions: GITHUB_TOKEN cannot create the site
      # itself ("Resource not accessible by integration"). enablement is left
      # on so this step recovers on its own if Pages is ever turned back off.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # No build step - the game is static files served as they sit in the repo.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
